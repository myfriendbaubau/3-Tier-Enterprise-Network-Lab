    ## 📋 Student Lab Tasks

    ### Phase 1 — Foundation
    - Configure hostnames on all 8 network devices
    - Set enable secret and console/VTY passwords; enable `service password-encryption`
    - Configure **Loopback0** on CORE1 (1.1.1.1/32), CORE2 (2.2.2.2/32), DIST1 (3.3.3.3/32), DIST2 (4.4.4.4/32)

    ### Phase 2 — VTP & VLAN Propagation
    - Configure **VTP version 2**, domain `ENTERPRISE` on all switches
    - Set **DIST1 as VTP Server**; DIST2 and all Access switches as **VTP Clients**
    - Create VLANs **10 (DATA)**, **20 (GUESTS)**, **30 (MGMT)**, **40 (SERVERS)** on DIST1
    - Verify propagation: `show vlan brief` on all access switches

    ### Phase 3 — STP Root Placement
    - Configure DIST1 as **primary root** for VLANs 10 and 30 (matching its active HSRP role)
    - Configure DIST2 as **primary root** for VLANs 20 and 40 (matching its active HSRP role)
    - Enable **PortFast** and **BPDU Guard** on ACC1–ACC4 host-facing ports (Ethernet1/0)
    - Verify: `show spanning-tree vlan 10` — DIST1 must be root bridge for VLAN 10

    ### Phase 4 — L2 EtherChannel (Distribution ↔ Access)
    - Configure **LACP mode active** port-channels on all Distribution–Access uplinks
    - **DIST1 side:** Po1 per ACC switch using Et1/x and Et2/x interfaces per mapping table
    - **DIST2 side:** Po2 per ACC switch using Et1/x and Et2/x interfaces per mapping table
    - **ACC side:** Po1 toward DIST1 (Et0/0 + Et0/1), Po2 toward DIST2 (Et0/2 + Et0/3)
    - Configure **dot1Q trunking** on all port-channels; allow only the VLAN for that access switch
    - Verify: `show etherchannel summary` — Po1 and Po2 must show **(P)** bundled

    ### Phase 5 — L3 EtherChannel (Core ↔ Distribution)
    - Configure all Core–Distribution member interfaces as **routed (no switchport)**
    - Build **LACP active** port-channels: CORE1 Po1↔DIST1, CORE1 Po2↔DIST2, CORE2 Po3↔DIST1, CORE2 Po4↔DIST2
    - Assign **/30 IP addresses** to the port-channel interfaces per the addressing plan
    - Configure the **direct routed link** CORE1 Et0/0 ↔ CORE2 Et0/0 (10.0.12.16/30)
    - Verify: `show interfaces port-channel X` — up/up; ping each /30 peer

    ### Phase 6 — OSPF Area 0
    - Enable **OSPF process 1** on CORE1, CORE2, DIST1, DIST2
    - Advertise all routed interfaces (port-channels + direct link) and **Loopback0**
    - Set `passive-interface` on all VLAN SVI interfaces at Distribution layer

    ### Phase 7 — HSRP
    - On **DIST1**: configure HSRP groups 10 and 30 with **priority 110** (Active); groups 20 and 40 stay at default priority (Standby)
    - On **DIST2**: configure HSRP groups 20 and 40 with **priority 110** (Active); groups 10 and 30 stay at default priority (Standby)
    - VIPs: VLAN10=10.0.10.1, VLAN20=10.0.20.1, VLAN30=10.0.30.1, VLAN40=10.0.40.1
    - Enable `preempt` on the active groups on each distribution switch
    - Verify: `show standby brief` — DIST1 Active for VLANs 10/30, DIST2 Active for VLANs 20/40

    ### Phase 8 — L2 Security
    - Enable **DHCP snooping** on ACC1–ACC4 for the appropriate VLANs
    - Mark Distribution uplink port-channels as **trusted**; Ethernet1/0 (PC ports) as **untrusted**
    - Configure **port-security** on Ethernet1/0 of all ACC switches: max 2 MACs, violation shutdown
    - Verify: `show ip dhcp snooping binding`, `show port-security interface Ethernet1/0`

    ### Phase 9 — ACLs (Inter-VLAN Restriction)
    - Create named ACL **`MGMT-RESTRICT`** on both DIST1 and DIST2
    - **Deny** traffic sourced from 10.0.10.0/24 (VLAN 10) destined to 10.0.30.0/24 (VLAN 30 MGMT)
    - **Deny** traffic sourced from 10.0.20.0/24 (VLAN 20) destined to 10.0.30.0/24 (VLAN 30 MGMT)
    - **Permit** all other traffic
    - Apply **inbound** on VLAN 10 and VLAN 20 SVI interfaces
    - Verify: `show ip access-lists MGMT-RESTRICT`; test with ping from PC1/PC2 to PC3

    ### Phase 10 — End-to-End Validation
    - ✅ PC1 ping PC2 (inter-VLAN — should succeed)
    - ❌ PC1 ping PC3 (ACL block — should fail)
    - ✅ PC1 ping PC4 (inter-VLAN — should succeed)
    - Shut DIST1 → verify HSRP Active role for VLANs 10/30 moves to DIST2
    - Remove one EtherChannel member link → verify traffic continues uninterrupted
    - Confirm STP root bridge is unchanged after failures

