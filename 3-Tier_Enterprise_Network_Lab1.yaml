      Topology Overview
      ┌─────────────────────────────────────────────┐
      │              FIREWALL EDGE                   │
      │               ASAV-0 (single, 3-legged)      │
      │  Gi0/0──CORE1 (10.0.12.20/30)                │
      │  Gi0/1──CORE2 (10.0.12.24/30)                │
      │  Gi0/2──outside──ext-conn-0 (192.168.255.0/24)│
      │  NAT: object INTERNAL-NET 10.0.0.0/8 (any,outside)│
      │  Route: CORE1 AD1 (primary) / CORE2 AD254 (floating backup)│
      │  Known limitation: single firewall = SPOF for internet path│
      └──────┬───────────────────────────────────────┘
             │
      ┌──────┴────────────────────────────────────────┐
      │              CORE LAYER                     │
      │   CORE1 ─────────────────────── CORE2       │
      │   (1.1.1.1)   10.0.12.16/30   (2.2.2.2)     │
      └──────┬──────────────────────────┬───────────┘
        Po10/Po11                    Po10/Po11
        (L3 EtherChannel)         (L3 EtherChannel)
      ┌──────┴──────────────────────────┴───────────┐
      │           DISTRIBUTION LAYER                │
      │   DIST1 ◄──── HSRP ────► DIST2              │
      │ (Active, 10,30)    (Active, 20,40)          │
      │ (Standby, 20,40)   (Standby, 10,30)         │
      └──────┬──────────────────────────┬───────────┘
           L2 EtherChannel trunks (LACP, dot1Q)
        ┌────┴────┬──────────┬──────────┴────┐
       [ACC1]  [ACC2]     [ACC3]       [ACC4]
       VLAN10  VLAN20    VLAN30       VLAN40
        |       |          |             |
      [PC1]    [PC2]      [PC3]         [PC4]
      10.0.10.11  10.0.20.11  10.0.30.11  10.0.40.11
