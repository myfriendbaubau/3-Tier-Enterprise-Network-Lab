          \ switchport mode trunk\n ip arp inspection trust\n ip dhcp snooping limit\
          \ rate 10\n ip dhcp snooping trust\n!\ninterface Port-channel2\n switchport\
          \ trunk encapsulation dot1q\n switchport trunk native vlan 99\n switchport\
          \ trunk allowed vlan 30,40\n switchport mode trunk\n ip arp inspection trust\n\
          \ ip dhcp snooping limit rate 10\n ip dhcp snooping trust\n!\ninterface\
          \ Ethernet0/0\n description #link to DIST1#\n switchport trunk encapsulation\
          \ dot1q\n switchport trunk native vlan 99\n switchport trunk allowed vlan\
          \ 30,40\n switchport mode trunk\n bandwidth 1000000\n ip arp inspection\
          \ trust\n channel-group 1 mode active\n ip dhcp snooping trust\n!\ninterface\
          \ Ethernet0/1\n description #link to DIST1#\n switchport trunk encapsulation\
          \ dot1q\n switchport trunk native vlan 99\n switchport trunk allowed vlan\
          \ 30,40\n switchport mode trunk\n bandwidth 1000000\n ip arp inspection\
          \ trust\n channel-group 1 mode active\n ip dhcp snooping trust\n!\ninterface\
          \ Ethernet0/2\n description description #link to DIST2#\n switchport trunk\
          \ encapsulation dot1q\n switchport trunk native vlan 99\n switchport trunk\
          \ allowed vlan 30,40\n switchport mode trunk\n bandwidth 1000000\n ip arp\
          \ inspection trust\n channel-group 2 mode active\n ip dhcp snooping trust\n\
          !\ninterface Ethernet0/3\n description description #link to DIST2#\n switchport\
          \ trunk encapsulation dot1q\n switchport trunk native vlan 99\n switchport\
          \ trunk allowed vlan 30,40\n switchport mode trunk\n bandwidth 1000000\n\
          \ ip arp inspection trust\n channel-group 2 mode active\n ip dhcp snooping\
          \ trust\n!\ninterface Ethernet1/0\n switchport access vlan 40\n switchport\
          \ mode access\n switchport port-security maximum 2\n switchport port-security\
          \ mac-address sticky\n switchport port-security mac-address sticky 5254.0074.db54\n\
          \ switchport port-security\n bandwidth 1000000\n spanning-tree portfast\n\
          \ spanning-tree bpduguard enable\n!\ninterface Ethernet1/1\n bandwidth 1000000\n\
          !\ninterface Ethernet1/2\n bandwidth 1000000\n!\ninterface Ethernet1/3\n\
          \ bandwidth 1000000\n!\nip forward-protocol nd\nip forward-protocol udp\n\
          !\n!\nip http server\nip http secure-server\nip ssh bulk-mode 131072\n!\n\
          no logging btrace\n!\n!\n!\ncontrol-plane\n!\n!\n!\nline con 0\n exec-timeout\
          \ 0 0\n logging synchronous\nline aux 0\nline vty 0 4\n exec-timeout 0 0\n\
          \ login\n transport input ssh\n!\n!\nend"
