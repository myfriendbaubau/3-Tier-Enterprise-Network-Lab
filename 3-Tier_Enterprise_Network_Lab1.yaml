lab:
  description: Core/Distribution/Access with OSPF, L3/L2 EtherChannel, HSRP, STP,
    VTP, L2 Security, ACLs
  notes: |
    # 🏢 3-Tier Enterprise Network Lab

    ## 🎯 Objectives

    - ✅ OSPF Area 0 between Core and Distribution layers
    - ✅ Layer 3 routed EtherChannel (LACP) — Core ↔ Distribution
    - ✅ Layer 2 EtherChannel + 802.1Q trunking — Distribution ↔ Access
    - ✅ HSRP first-hop redundancy (DIST1=Active for VLANs 10/30, DIST2=Active for VLANs 20/40)
    - ✅ Deterministic STP root placement per VLAN, aligned with the active HSRP gateway
    - ✅ VTP version 2 for VLAN propagation
    - ✅ VLAN segmentation: VLANs 10, 20, 30, 40
    - ✅ L2 Security: BPDU Guard, port-security, DHCP snooping
    - ✅ Named ACL restricting inter-VLAN management access

    ---

    ## 🗺️ Topology Overview

    ```
    ┌─────────────────────────────────────────────┐
    │              CORE LAYER                     │
    │   CORE1 ─────────────────────── CORE2       │
    │   (1.1.1.1)   10.0.12.16/30   (2.2.2.2)    │
    └──────┬──────────────────────────┬───────────┘
      Po1/Po2                    Po3/Po4
      (L3 EtherChannel)         (L3 EtherChannel)
    ┌──────┴──────────────────────────┴───────────┐
    │           DISTRIBUTION LAYER                │
    │   DIST1 ◄──── HSRP ────► DIST2              │
    │ (Active: VLANs 10,30)  (Active: VLANs 20,40)│
    └──────┬──────────────────────────┬───────────┘
         L2 EtherChannel trunks (LACP, dot1Q)
      ┌────┴────┬──────────┬──────────┴────┐
     [ACC1]  [ACC2]     [ACC3]       [ACC4]
    VLAN10  VLAN20    VLAN30       VLAN40
      |       |          |             |
    [PC1]   [PC2]      [PC3]        [PC4]
    10.0.10.11  10.0.20.11  10.0.30.11  10.0.40.11
    ```

    ---

    ## 📦 IP Addressing Plan

    ### L3 EtherChannel Port-Channels (Routed)

    | Link | Subnet | CORE IP | DIST IP |
    |---|---|---|---|
    | CORE1 ↔ DIST1 (Po1) | 10.0.12.0/30 | 10.0.12.1 | 10.0.12.2 |
    | CORE1 ↔ DIST2 (Po2) | 10.0.12.4/30 | 10.0.12.5 | 10.0.12.6 |
    | CORE2 ↔ DIST1 (Po3) | 10.0.12.8/30 | 10.0.12.9 | 10.0.12.10 |
    | CORE2 ↔ DIST2 (Po4) | 10.0.12.12/30 | 10.0.12.13 | 10.0.12.14 |
    | CORE1 ↔ CORE2 | 10.0.12.16/30 | 10.0.12.17 | 10.0.12.18 |

    ### Loopbacks (OSPF Router-IDs)

    | Device | Loopback0 |
    |---|---|
    | CORE1 | 1.1.1.1/32 |
    | CORE2 | 2.2.2.2/32 |
    | DIST1 | 3.3.3.3/32 |
    | DIST2 | 4.4.4.4/32 |

    ### VLAN SVIs & HSRP (on DIST1 and DIST2)

    | VLAN | Name | Subnet | DIST1 SVI | DIST2 SVI | HSRP VIP | Active |
    |---|---|---|---|---|---|---|
    | 10 | DATA | 10.0.10.0/24 | 10.0.10.2/24 | 10.0.10.3/24 | 10.0.10.1 | DIST1 |
    | 20 | VOICE | 10.0.20.0/24 | 10.0.20.2/24 | 10.0.20.3/24 | 10.0.20.1 | DIST2 |
    | 30 | MGMT | 10.0.30.0/24 | 10.0.30.2/24 | 10.0.30.3/24 | 10.0.30.1 | DIST1 |
